<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Loja das Amigas 💖</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: Arial, sans-serif;
}

body {
  background: #fff7fb;
  color: #382532;
}

header {
  background: linear-gradient(135deg, #ff5fa2, #a95de8);
  color: white;
  padding: 18px 6%;
  display: flex;
  justify-content: space-between;
  align-items: center;
  position: sticky;
  top: 0;
  z-index: 100;
}

.logo {
  font-size: 24px;
  font-weight: bold;
}

.cart-button {
  border: none;
  background: white;
  color: #a13d7c;
  padding: 12px 18px;
  border-radius: 30px;
  font-weight: bold;
  cursor: pointer;
}

.hero {
  text-align: center;
  padding: 65px 20px;
  background: linear-gradient(180deg, #ffdcec, #fff7fb);
}

.hero h1 {
  font-size: 42px;
  margin-bottom: 15px;
}

.hero p {
  font-size: 18px;
}

.search {
  width: 100%;
  max-width: 650px;
  margin-top: 30px;
  padding: 15px 20px;
  border: 2px solid #f3b2d1;
  border-radius: 30px;
  font-size: 16px;
  outline: none;
}

main {
  max-width: 1100px;
  margin: auto;
  padding: 45px 20px;
}

main h2 {
  text-align: center;
  font-size: 30px;
  margin-bottom: 30px;
}

.products {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 25px;
}

.product {
  background: white;
  border-radius: 20px;
  overflow: hidden;
  box-shadow: 0 8px 25px rgba(180, 70, 130, 0.12);
  transition: 0.2s;
  padding-bottom: 18px;
}

.product:hover {
  transform: translateY(-5px);
}

.product-image {
  height: 180px;
  background: #fde5f0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 75px;
}

.product h3 {
  margin: 15px 18px 8px;
}

.price {
  margin: 0 18px 15px;
  color: #bd468e;
  font-size: 22px;
  font-weight: bold;
}

.add-button {
  width: calc(100% - 36px);
  margin: 0 18px;
  padding: 13px;
  border: none;
  border-radius: 12px;
  background: #bd5a9b;
  color: white;
  font-weight: bold;
  cursor: pointer;
}

.add-button:hover {
  background: #963d79;
}

footer {
  background: #33232d;
  color: white;
  text-align: center;
  padding: 30px;
  margin-top: 30px;
}

.whatsapp-contact {
  margin-top: 10px;
  font-weight: bold;
}

.modal {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.65);
  z-index: 999;
  justify-content: center;
  align-items: center;
  padding: 20px;
}

.cart-box {
  background: white;
  width: 100%;
  max-width: 520px;
  max-height: 85vh;
  overflow-y: auto;
  border-radius: 20px;
  padding: 25px;
}

.cart-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
}

.close {
  background: none;
  border: none;
  font-size: 30px;
  cursor: pointer;
}

.cart-item {
  display: grid;
  grid-template-columns: 1fr auto auto;
  gap: 10px;
  align-items: center;
  padding: 14px 0;
  border-bottom: 1px solid #eee;
}

.remove {
  border: none;
  background: #ff6688;
  color: white;
  padding: 7px 10px;
  border-radius: 8px;
  cursor: pointer;
}

.total {
  margin-top: 20px;
  font-size: 22px;
  font-weight: bold;
}

.whatsapp {
  width: 100%;
  margin-top: 18px;
  padding: 15px;
  border: none;
  border-radius: 12px;
  background: #25d366;
  color: white;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}

.empty {
  text-align: center;
  color: #777;
  padding: 25px;
}

@media (max-width: 600px) {
  header {
    padding: 15px;
  }

  .logo {
    font-size: 18px;
  }

  .cart-button {
    padding: 9px 12px;
  }

  .hero h1 {
    font-size: 32px;
  }

  .cart-item {
    grid-template-columns: 1fr;
  }
}
</style>
</head>

<body>

<header>
  <div class="logo">
    💖 Loja das Amigas
  </div>

  <button class="cart-button" onclick="openCart()">
    🛒 Carrinho (<span id="cartCount">0</span>)
  </button>
</header>

<section class="hero">
  <h1>Pulseiras lindas e baratinhas ✨</h1>

  <p>Escolha sua favorita e faça seu pedido pelo WhatsApp 💕</p>

  <input
    class="search"
    id="search"
    type="text"
    placeholder="🔎 Procurar pulseira..."
    oninput="searchProducts()"
  >
</section>

<main>
  <h2>💕 Nossas Pulseiras</h2>

  <div class="products" id="products"></div>
</main>

<footer>
  <p>© 2026 Loja das Amigas</p>

  <p class="whatsapp-contact">
    📱 WhatsApp: (11) 99110-6862
  </p>

  <p style="margin-top: 8px;">
    Pulseiras feitas com carinho 💖
  </p>
</footer>

<div class="modal" id="cartModal">
  <div class="cart-box">

    <div class="cart-header">
      <h2>🛍️ Seu Carrinho</h2>

      <button class="close" onclick="closeCart()">×</button>
    </div>

    <div id="cartItems"></div>

    <div class="total" id="cartTotal">
      Total: R$ 0,00
    </div>

    <button class="whatsapp" onclick="finishOrder()">
      💬 Finalizar pedido pelo WhatsApp
    </button>

  </div>
</div>

<script>

/* PRODUTOS */

const products = [

  {
    name: "Pulseira Pink",
    price: 5.90,
    emoji: "💗"
  },

  {
    name: "Pulseira Love",
    price: 4.90,
    emoji: "💖"
  },

  {
    name: "Pulseira Colorida",
    price: 3.90,
    emoji: "🌈"
  },

  {
    name: "Pulseira de Seleções",
    price: 6.90,
    emoji: "💖"
  },

  {
    name: "Pulseira Amizade",
    price: 4.90,
    emoji: "🩷"
  },

  {
    name: "Pulseira de Ouro",
    price: 3.90,
    emoji: "💛"
  }

];

let cart = [];


/* FORMATAR PREÇO */

function formatPrice(value) {
  return value
    .toFixed(2)
    .replace(".", ",");
}


/* MOSTRAR PRODUTOS */

function showProducts(list = products) {

  const container = document.getElementById("products");

  if (list.length === 0) {
    container.innerHTML = `
      <p style="grid-column:1/-1; text-align:center; font-size:18px;">
        Nenhuma pulseira encontrada 💔
      </p>
    `;
    return;
  }

  container.innerHTML = list.map(product => {

    const index = products.indexOf(product);

    return `
      <div class="product">

        <div class="product-image">
          ${product.emoji}
        </div>

        <h3>${product.name}</h3>

        <p class="price">
          R$ ${formatPrice(product.price)}
        </p>

        <button
          class="add-button"
          onclick="addToCart(${index})"
        >
          🛒 Adicionar ao carrinho
        </button>

      </div>
    `;

  }).join("");

}


/* ADICIONAR AO CARRINHO */

function addToCart(index) {

  cart.push(products[index]);

  updateCart();

  alert(
    products[index].name +
    " foi adicionada ao carrinho! 💖"
  );

}


/* ATUALIZAR CARRINHO */

function updateCart() {
  document.getElementById("cartCount").textContent = cart.length;
}


/* ABRIR CARRINHO */

function openCart() {
  document.getElementById("cartModal").style.display = "flex";

  renderCart();
}


/* FECHAR CARRINHO */

function closeCart() {
  document.getElementById("cartModal").style.display = "none";
}


/* MOSTRAR ITENS DO CARRINHO */

function renderCart() {

  const container = document.getElementById("cartItems");

  if (cart.length === 0) {

    container.innerHTML = `
      <div class="empty">
        Seu carrinho está vazio 🛍️
      </div>
    `;

    document.getElementById("cartTotal").textContent =
      "Total: R$ 0,00";

    return;
  }

  container.innerHTML = cart.map((product, index) => {

    return `
      <div class="cart-item">

        <span>
          ${product.emoji} ${product.name}
        </span>

        <strong>
          R$ ${formatPrice(product.price)}
        </strong>

        <button
          class="remove"
          onclick="removeFromCart(${index})"
        >
          Remover
        </button>

      </div>
    `;

  }).join("");


  const total = cart.reduce(
    (sum, product) => sum + product.price,
    0
  );

  document.getElementById("cartTotal").textContent =
    "Total: R$ " + formatPrice(total);

}


/* REMOVER DO CARRINHO */

function removeFromCart(index) {

  cart.splice(index, 1);

  updateCart();

  renderCart();

}


/* PESQUISAR PRODUTOS */

function searchProducts() {

  const text = document
    .getElementById("search")
    .value
    .toLowerCase();

  const result = products.filter(product =>
    product.name
      .toLowerCase()
      .includes(text)
  );

  showProducts(result);

}


/* FINALIZAR PEDIDO */

function finishOrder() {

  if (cart.length === 0) {

    alert(
      "Adicione uma pulseira ao carrinho primeiro! 💕"
    );

    return;
  }


  const total = cart.reduce(
    (sum, product) => sum + product.price,
    0
  );


  let message =
    "Olá! 💖 Quero fazer um pedido na Loja das Amigas:\n\n";


  cart.forEach(product => {

    message +=
      "• " +
      product.name +
      " - R$ " +
      formatPrice(product.price) +
      "\n";

  });


  message +=
    "\n💰 Total: R$ " +
    formatPrice(total);


  /* NÚMERO DO WHATSAPP */

  const phone = "5511991106862";


  const url =
    "https://wa.me/" +
    phone +
    "?text=" +
    encodeURIComponent(message);


  window.open(url, "_blank");

}


/* INICIAR SITE */

showProducts();

</script>

</body>
</html>
